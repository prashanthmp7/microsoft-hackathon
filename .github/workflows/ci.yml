name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SecondHalfMind.sln

      - name: Build (warnings are errors)
        run: dotnet build SecondHalfMind.sln --no-restore -c Release

      - name: Test (includes architecture tests for the read-only agent guarantee)
        run: dotnet test SecondHalfMind.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
