name: Deploy to Azure

# Manual deploy using OpenID Connect: no long-lived Azure credentials are stored in GitHub.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: shmind-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          ACR=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          az acr build -r "$ACR" -t second-half-mind:${{ github.sha }} .
          echo "IMAGE=$(az acr show -n "$ACR" --query loginServer -o tsv)/second-half-mind:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Roll out
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$APP_NAME" --image "$IMAGE"
